version: 1
backend:
  phases:
    build:
      commands:
        - echo "No backend deployment required"
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - pnpm install
        - echo "Setting AMPLIFY_APP_ID=${AMPLIFY_APP_ID:-d37ec0x3muq59q}"
        - echo "NEXT_PUBLIC_AWS_REGION=${AWS_REGION:-us-east-1}" >> .env.local
        - echo "NEXT_PUBLIC_AMPLIFY_APP_ID=${AMPLIFY_APP_ID:-d37ec0x3muq59q}" >> .env.local
        - echo "NEXT_PUBLIC_API_URL=https://api.warrity.com" >> .env.local
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .pnpm-store/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Access-Control-Allow-Origin'
          value: '*'
        - key: 'Access-Control-Allow-Methods'
          value: 'GET,HEAD,PUT,PATCH,POST,DELETE'
        - key: 'Access-Control-Allow-Headers'
          value: 'Content-Type, Authorization'
api:
  phases:
    preBuild:
      commands:
        - cd api
        - npm install -g pnpm
        - pnpm install
        - cp .env.production .env
    build:
      commands:
        - pnpm install --prod
        - pnpm run postbuild
    start:
      commands:
        - pnpm run start:pm2
  artifacts:
    baseDirectory: api
    files:
      - '**/*'
  cache:
    paths:
      - api/node_modules/**/*
      - api/.pnpm-store/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Access-Control-Allow-Origin'
          value: 'https://stable-21-03-25.dkewumso9wy5d.amplifyapp.com'
        - key: 'Access-Control-Allow-Methods'
          value: 'GET,HEAD,PUT,PATCH,POST,DELETE'
        - key: 'Access-Control-Allow-Headers'
          value: 'Content-Type, Authorization'
        - key: 'Access-Control-Allow-Credentials'
          value: 'true' 