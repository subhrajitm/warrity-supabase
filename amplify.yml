version: 1
backend:
  phases:
    build:
      commands:
        - amplifyPush --simple
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Access-Control-Allow-Origin'
          value: '*'
        - key: 'Access-Control-Allow-Methods'
          value: 'GET,HEAD,PUT,PATCH,POST,DELETE'
        - key: 'Access-Control-Allow-Headers'
          value: 'Content-Type, Authorization'
api:
  phases:
    preBuild:
      commands:
        - cd api
        - npm install
        - cp .env.production .env
    build:
      commands:
        - npm ci --production
        - npm run postbuild
    start:
      commands:
        - npm run start:pm2
  artifacts:
    baseDirectory: api
    files:
      - '**/*'
  cache:
    paths:
      - api/node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Access-Control-Allow-Origin'
          value: 'https://stable-21-03-25.dkewumso9wy5d.amplifyapp.com'
        - key: 'Access-Control-Allow-Methods'
          value: 'GET,HEAD,PUT,PATCH,POST,DELETE'
        - key: 'Access-Control-Allow-Headers'
          value: 'Content-Type, Authorization'
        - key: 'Access-Control-Allow-Credentials'
          value: 'true' 