version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment:
      - NODE_ENV=production
      - PORT=5001
      - CORS_ORIGIN=https://warrity.com,https://www.warrity.com,https://d1r6p358acsglz.cloudfront.net,https://stable-21-03-25.dkewumso9wy5d.amplifyapp.com
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
      - UPLOAD_PATH=uploads
      - MAX_FILE_SIZE=10485760
      - LOG_LEVEL=info
      - API_URL=https://api.warrity.com
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - app-network
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./uploads:/usr/src/app/uploads
    depends_on:
      - api
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge 